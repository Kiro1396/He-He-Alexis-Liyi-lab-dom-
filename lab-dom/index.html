<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lab DOM</title>
</head>
<body>
    <!-- PARTE 1-->
    <h1 id="titulo">Mi primera página dinámica</h1>
    <ul id="Lista"></ul>
    <hr>

    <!-- PARTE 2-->
    <button id="saludar">Saludar</button>

    <ul id="tareas">
        <li>
            <span class="texto">Tarea de ejemplo 1</span>
            <button class="borrar">Borrar</button>
        </li>
        <li>
            <span class="texto">Tarea de ejemplo 2</span>
            <button class="borrar">Borrar</button>
        </li>
    </ul>
    <hr>

    <!-- PARTE 3-->
    <form id="registro" novalidate>
        <div>
            <label for="nombre">Nombre Completo</label>
            <input id="nombre" name="nombre" type="text" required>
            <p id="nombre-error" aria-live="polite"></p>
        </div>

        <div>
            <label for="correo">Correo</label>
            <input id="correo" name="correo" type="email" required aria-describedby="correo-error">
            <p id="correo-error" aria-live="polite"></p>
        </div>

        <div>
            <label for="cedula">Cédula</label>
            <input id="cedula" name="cedula" required pattern="([1-9]|1[0-3]|PE|E|N)-\d{1,4}-\d{1,6}" placeholder="8-123-4567">
            <p id="cedula-error" aria-live="polite"></p>
        </div>

        <div>
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" required>
            <p id="clave-error" aria-live="polite"></p>
        </div>

        <div>
            <label for="clave2">Confirmar Contraseña</label>
            <input id="clave2" name="clave2" type="password" required>
            <p id="clave2-error" aria-live="polite"></p>
        </div>

        <button type="submit">Enviar</button>
    </form>

    <!-- Conexión directa con tu lógica de JavaScript -->
    <script src="app.js" defer></script>
</body>
</html>
